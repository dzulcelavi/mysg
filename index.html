<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYSG</title>
<meta name="description" content="MYSG: moving from Singapore to Johor, Malaysia.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#010066">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MYSG">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#010066;--primary-2:#1A2A9C;--accent:#EF3340;--ink:#0f2230;--muted:#5b6b78}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{padding:18px 22px}
.logo{font-weight:800;font-size:1.5rem;color:var(--primary);text-decoration:none;letter-spacing:-.01em}
.logo b{color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 22px 48px}
.mark{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 24px rgba(1,0,102,.18);margin-bottom:22px}
h1{font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.15;margin:0 0 12px;color:var(--primary)}
h1 span{color:var(--accent)}
p{color:var(--muted);font-size:1.05rem;margin:0 0 28px;max-width:30em}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;text-decoration:none;font:800 1.1rem Nunito,sans-serif;padding:16px 28px;border-radius:14px;box-shadow:0 6px 18px rgba(239,51,64,.3)}
.btn:hover{background:#C8102E}
.url{margin-top:14px;font-size:.9rem;color:var(--muted)}
.install{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(15,34,48,.15);max-width:480px;margin:0 auto}
.install.show{display:flex}
.install img{width:40px;height:40px;border-radius:10px}
.install p{margin:0;flex:1;font-size:.9rem;color:var(--ink);text-align:left}
.install button{font:700 .9rem Nunito,sans-serif;border:0;border-radius:10px;cursor:pointer}
#installbtn{background:var(--primary);color:#fff;padding:8px 14px}
#installx{background:none;font-size:1.4rem;color:var(--muted);padding:0 4px}
</style>
</head>
<body>
<header><a class="logo" href="./" aria-label="MYSG home">MY<b>SG</b></a></header>
<main>
  <img class="mark" src="icons/icon-192.png" alt="">
  <h1>Moving to Johor, <span>made simple.</span></h1>
  <p>Everything you need to plan your move from Singapore to Johor is on Move to Malaysia.</p>
  <a class="btn" href="https://movetomalaysia.com/" target="_blank" rel="noopener">Visit movetomalaysia.com <span aria-hidden="true">↗</span></a>
  <div class="url">movetomalaysia.com</div>
</main>
<div class="install" id="install" role="dialog" aria-label="Install the app"><img src="icons/icon-192.png" alt=""><p id="installtxt"><strong>Install MYSG</strong><br>Add it to your home screen for one-tap access.</p><button id="installbtn">Install</button><button id="installx" aria-label="Dismiss">×</button></div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
(function(){
  var box=document.getElementById('install'), standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone, seen=false;
  try{ seen=localStorage.getItem('mysg-install-x')==='1'; }catch(e){}
  if(standalone||seen) return;
  var deferred=null;
  addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred=e; box.classList.add('show'); });
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){ document.getElementById('installtxt').innerHTML='<strong>Install MYSG</strong><br>Tap Share, then <b>Add to Home Screen</b>.'; document.getElementById('installbtn').style.display='none'; setTimeout(function(){ box.classList.add('show'); },1500); }
  document.getElementById('installbtn').onclick=function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.then(function(){ deferred=null; box.classList.remove('show'); }); };
  document.getElementById('installx').onclick=function(){ box.classList.remove('show'); try{ localStorage.setItem('mysg-install-x','1'); }catch(e){} };
  addEventListener('appinstalled', function(){ box.classList.remove('show'); });
})();
</script>
</body>
</html>
