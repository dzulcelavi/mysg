<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYSG - To JB, so easy.</title>
<meta name="description" content="MYSG: a directory of companies and services for moving to and settling in Johor, Malaysia.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#010066">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MYSG">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#010066;--accent:#EF3340;--ink:#0f2230;--muted:#64748b;--bg:#f3f4f8;--card:#fff;--tab:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
a{color:inherit}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px 6px;flex:0 0 auto}
.logo{font-weight:800;font-size:1.65rem;color:var(--primary);text-decoration:none;letter-spacing:-.02em}
.logo b{color:var(--accent)}
.seg{margin-left:auto;display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 2px 10px rgba(15,34,48,.06)}
.seg button{border:0;background:none;font:700 .82rem Nunito,sans-serif;color:var(--muted);padding:7px 11px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
.back{border:0;background:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--primary);box-shadow:0 2px 8px rgba(15,34,48,.06)}
.ttl{font-weight:800;font-size:1.1rem;line-height:1.2;color:var(--primary);flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.screen{flex:1;min-height:0;overflow-y:auto;padding:0 18px calc(var(--tab) + 18px + env(safe-area-inset-bottom))}
.screen.fit{overflow:hidden;display:flex;flex-direction:column}
h1.hl{color:var(--primary);font-size:clamp(1.35rem,3.6vh,1.75rem);line-height:1.15;margin:clamp(4px,1vh,10px) 0 clamp(8px,1.6vh,14px)}
h1.hl span{color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:clamp(10px,1.8vh,15px) 16px;color:var(--primary);box-shadow:0 6px 20px rgba(15,34,48,.07);position:relative}
.search input{border:0;background:none;font:600 1rem Nunito,sans-serif;flex:1;outline:none;color:var(--ink);min-width:0}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(15,34,48,.16);z-index:5;max-height:46vh;overflow:auto;padding:6px}
.sres a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;text-decoration:none}
.sres a:hover{background:var(--bg)}
.sres small{display:block;color:var(--muted);font-size:.78rem}
.shd{display:flex;align-items:baseline;justify-content:space-between;margin:clamp(10px,2.2vh,20px) 0 clamp(6px,1.2vh,10px)}
.shd h2{margin:0;font-size:1.15rem}
.shd a{font-weight:700;font-size:.88rem;color:var(--primary);text-decoration:none;margin-left:14px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.4vh,12px)}
.bigt{background:#fff;border-radius:18px;padding:clamp(10px,1.8vh,15px) 12px;display:flex;align-items:center;gap:12px;text-decoration:none;min-height:clamp(56px,9vh,84px);box-shadow:0 2px 10px rgba(15,34,48,.04)}
.bigt .ic{width:clamp(40px,6vh,50px);height:clamp(40px,6vh,50px);border-radius:14px;display:grid;place-items:center;font-size:clamp(20px,3vh,24px);flex:0 0 auto}
.bigt b{display:block;font-size:.98rem;line-height:1.2}
.bigt small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.4vh,14px) 4px;margin-top:clamp(10px,2vh,18px)}
.icons a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;font:600 .78rem Nunito,sans-serif;text-align:center;line-height:1.15}
.icons span{width:clamp(42px,6.2vh,52px);height:clamp(42px,6.2vh,52px);border-radius:15px;background:#fff;display:grid;place-items:center;font-size:clamp(19px,2.8vh,23px);box-shadow:0 2px 8px rgba(15,34,48,.05)}
/* Every banner (Move to Malaysia, Advertise on MYSG, future ads) uses the same MYSG navy-to-red gradient; advertiser logos sit on a white pill */
.promo{margin-top:auto;display:block;border-radius:20px;padding:clamp(12px,2vh,16px) 16px;color:#fff;text-decoration:none;background:linear-gradient(135deg,#010066 0%,#EF3340 100%);position:relative}
.promo .k{font:800 .82rem Nunito,sans-serif;color:rgba(255,255,255,.85)}
.promo h3{margin:3px 0 0;font-size:clamp(1rem,2.4vh,1.15rem);color:#fff}
.promo .tag{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.18);border-radius:8px;padding:3px 9px;font:700 .75rem Nunito,sans-serif}
.promo .chip{display:inline-block;margin-top:8px;background:rgba(255,255,255,.18);border-radius:8px;padding:3px 10px;font:700 .78rem Nunito,sans-serif}
.promos{margin-top:auto;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:20px}
.promos::-webkit-scrollbar{display:none}
.logopill{display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:3px 8px;margin-top:6px}
.logopill img{display:block;height:clamp(26px,4vh,34px);width:auto}
.promos .promo{flex:0 0 100%;scroll-snap-align:center;margin-top:0}
.pdots{display:flex;justify-content:center;gap:5px;margin-top:6px}
.pdots i{width:6px;height:6px;border-radius:9px;background:#d0d5dd;transition:width .2s}
.pdots i.on{width:16px;background:#010066}
.item{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px rgba(15,34,48,.04)}
.item .t{flex:1;min-width:0}
.item b{display:block}
.item .d{color:var(--muted);font-size:.88rem;margin:2px 0 6px}
.item .a{font-size:.75rem;font-weight:700;color:var(--primary);background:#eef0fa;border-radius:6px;padding:2px 7px}
.item.star{box-shadow:0 0 0 2px rgba(239,51,64,.35)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.acts a,.acts button{font:700 .78rem Nunito,sans-serif;text-decoration:none;border-radius:9px;padding:6px 10px;text-align:center;white-space:nowrap;border:0;cursor:pointer}
.acts .w{background:var(--accent);color:#fff}
.acts .m{background:var(--bg);color:var(--ink)}
.acts .s{background:none;font-size:1.05rem;padding:2px}
.list a.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:8px;text-decoration:none;font-weight:700}
.list .row small{margin-left:auto;color:var(--muted);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
/* Points chip, Rewards, Advertise plans */
.hlrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pts{display:inline-flex;align-items:center;gap:4px;background:#fff;color:var(--primary);border-radius:999px;padding:5px 10px;font:800 .8rem Nunito,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(15,34,48,.06);white-space:nowrap;flex:0 0 auto}
.pts i{font-style:normal;color:var(--accent)}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(15,34,48,.04)}
.card h3{margin:0 0 8px;font-size:1rem}
.ptotal{display:flex;align-items:baseline;gap:8px}
.ptotal b{font-size:2.2rem;color:var(--primary);line-height:1}
.ptotal span{color:var(--muted);font-weight:700}
.lvl{display:flex;justify-content:space-between;font:700 .85rem Nunito,sans-serif;margin-top:10px}
.lvl .nx{color:var(--muted)}
.bar2{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#010066,#EF3340);border-radius:9px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--bg);font-size:.88rem}
.rrow:first-of-type{border-top:0}
.rrow b{color:var(--primary);white-space:nowrap}
.rrow .soon{font:700 .72rem Nunito,sans-serif;color:var(--accent);background:#FDE7E9;border-radius:6px;padding:3px 8px;white-space:nowrap}
.plan .pr{font:800 .95rem Nunito,sans-serif;color:var(--primary);margin:8px 0}
.plan .row2{display:flex;align-items:center;gap:8px}
.paybtn{font:800 .88rem Nunito,sans-serif;border:0;border-radius:10px;padding:9px 16px;background:var(--accent);color:#fff;text-decoration:none;display:inline-block}
.paybtn[aria-disabled=true]{background:#d0d5dd;color:#fff;pointer-events:none}
.plan .soon{font:700 .72rem Nunito,sans-serif;color:var(--accent);background:#FDE7E9;border-radius:6px;padding:3px 8px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom));background:var(--primary);color:#fff;font:800 .85rem Nunito,sans-serif;padding:8px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(15,34,48,.25);z-index:12;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.term{cursor:pointer}
.term .rd{color:#16a34a;font-weight:800;margin-left:6px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 6px 6px}
.pchips .lbl{width:100%;font:700 .75rem Nunito,sans-serif;color:var(--muted);padding:0 4px}
.pchips button{border:0;background:var(--bg);border-radius:999px;padding:6px 11px;font:700 .8rem Nunito,sans-serif;color:var(--ink);cursor:pointer}
/* Community */
.ctop{position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:2}
.cseg{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 2px 10px rgba(15,34,48,.06);margin-bottom:10px}
.cseg a{flex:1;text-align:center;text-decoration:none;font:700 .88rem Nunito,sans-serif;color:var(--muted);padding:8px 10px;border-radius:999px}
.cseg a.on{background:var(--primary);color:#fff}
.term{background:#fff;border-radius:14px;padding:11px 14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(15,34,48,.04)}
.term .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.term b{font-size:.98rem}
.term .d{color:var(--muted);font-size:.88rem;margin-top:3px}
.tag{font:700 .72rem Nunito,sans-serif;color:var(--primary);background:#eef0fa;border-radius:6px;padding:2px 7px;white-space:nowrap}
.thr{background:#fff;border-radius:16px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(15,34,48,.04)}
.thr .t{flex:1;min-width:0}
.thr .d{color:var(--muted);font-size:.86rem;margin-top:2px}
.thr .soon{font:700 .72rem Nunito,sans-serif;color:var(--accent);background:#FDE7E9;border-radius:6px;padding:3px 8px;white-space:nowrap}
.thr .wa{font:700 .78rem Nunito,sans-serif;background:var(--accent);color:#fff;border-radius:9px;padding:7px 10px;text-decoration:none;white-space:nowrap}
/* Map tab: fills the screen between header and tab bar, never scrolls */
.screen.mapv{overflow:hidden;display:flex;flex-direction:column;gap:8px}
.mchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto;padding:2px 0}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:0 0 auto;border:0;background:#fff;border-radius:999px;padding:7px 12px;font:700 .8rem Nunito,sans-serif;color:var(--ink);white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(15,34,48,.05)}
.mchips button.on{background:var(--primary);color:#fff}
.mapbox{flex:1;min-height:0;position:relative;border-radius:18px;overflow:hidden;background:#e6e8ef;box-shadow:0 2px 10px rgba(15,34,48,.06)}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gmo{position:absolute;right:10px;bottom:10px;background:var(--primary);color:#fff;font:700 .8rem Nunito,sans-serif;padding:8px 12px;border-radius:10px;text-decoration:none;box-shadow:0 4px 14px rgba(15,34,48,.25)}
.note{color:var(--muted);font-size:.82rem;margin:18px 4px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding:6px 10px env(safe-area-inset-bottom);background:#fff;border-radius:22px 22px 0 0;display:flex;box-shadow:0 -4px 20px rgba(15,34,48,.06)}
.tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font:700 .74rem Nunito,sans-serif;color:var(--muted);border-radius:16px}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--primary);background:#E6E8F7}
@media (max-height:720px){h1.hl{font-size:1.25rem;margin:2px 0 8px}.shd{margin:8px 0 6px}.bigt{padding:8px 10px}.icons{margin-top:8px;row-gap:6px}.icons a{font-size:.72rem;gap:4px}.promo{padding:10px 14px}.promo .chip{display:none}}
.install{position:absolute;left:12px;right:12px;bottom:calc(var(--tab) + 12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(15,34,48,.18);z-index:9}
.install.show{display:flex}
.install img{width:40px;height:40px;border-radius:10px}
.install p{margin:0;flex:1;font-size:.88rem}
.install button{font:700 .88rem Nunito,sans-serif;border:0;border-radius:10px;cursor:pointer}
#installbtn{background:var(--primary);color:#fff;padding:8px 14px}
#installx{background:none;font-size:1.4rem;color:var(--muted);padding:0 4px}
</style>
</head>
<body>
<div class="app">
  <header class="bar" id="bar"></header>
  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar">
    <a href="#home" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#map" data-t="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Map</a>
    <a href="#community" data-t="community"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a5 5 0 0 1 3.5 4.8V20"/></svg>Community</a>
    <a href="#saved" data-t="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Saved</a>
    <a href="#more" data-t="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>More</a>
  </nav>
  <div class="toast" id="toast"></div>
  <div class="install" id="install" role="dialog" aria-label="Install the app"><img src="icons/icon-192.png" alt=""><p id="installtxt"><strong>Install MYSG</strong><br>Add it to your home screen for one-tap access.</p><button id="installbtn">Install</button><button id="installx" aria-label="Dismiss">×</button></div>
</div>
<script src="directory.js"></script>
<script src="terms.js"></script>
<script src="pay.js"></script>
<script>
(function(){
var D=window.MYSG_DIR, MTM='https://movetomalaysia.com/';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var C={}; D.forEach(function(c){C[c.id]=c;});
var ALL=[]; D.forEach(function(c){c.items.forEach(function(i){ALL.push({c:c,i:i});});});
var BG=['#E6E8F7','#FDE7E9','#FEF3D6','#EDE3FB'];
var AUD={all:['schools','property','health','transport'],family:['schools','health','property','shopping'],retire:['gov','health','money','property'],business:['gov','property','money','telco']};
var aud='all';
var saved=[]; try{saved=JSON.parse(localStorage.getItem('mysg-saved')||'[]');}catch(e){}
function isSaved(n){return saved.indexOf(n)>-1;}
function toggleSave(n){ if(isSaved(n)) saved=saved.filter(function(x){return x!==n;}); else saved.push(n); try{localStorage.setItem('mysg-saved',JSON.stringify(saved));}catch(e){} }
/* Search that understands everyday words: case-insensitive, ignores punctuation, partial words,
   and matches each category's everyday words (tags in directory.js) and the Common Terms (terms.js). */
var TERMS=window.MYSG_TERMS||[], THREADS=window.MYSG_THREADS||[];
var STOP=['to','in','the','a','an','of','for','near','at','my','i','me','and','or','is','where','how'];
var POPULAR=['Clinic','Rent','SIM Card','Bank Account','Visa','Bus to SG'];
function norm(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function words(v){ v=String(v).toLowerCase().replace(/a\s*&\s*e/g,'emergency'); return norm(v).split(' ').filter(function(w){return w.length>1&&STOP.indexOf(w)<0;}); }
var CATTXT={}; D.forEach(function(c){ CATTXT[c.id]=norm(c.name+' '+(c.short||'')+' '+(c.tags||'')+' '+TERMS.filter(function(t){return t[3]===c.id;}).map(function(t){return t[0];}).join(' ')); });
function hit(ws,txt){ return ws.length>0&&ws.every(function(w){return txt.indexOf(w)>-1;}); }
function findListings(v){ var ws=words(v); if(!ws.length) return [];
  var own=[], viaCat=[];
  ALL.forEach(function(x){ var t=norm(x.i.join(' ')); if(hit(ws,t)) own.push(x); else if(hit(ws,t+' '+CATTXT[x.c.id])) viaCat.push(x); });
  return own.concat(viaCat); }
function findCats(v){ var ws=words(v); return D.filter(function(c){return hit(ws,CATTXT[c.id]);}); }
function findTerms(v){ var ws=words(v); return TERMS.filter(function(t){return hit(ws,norm(t[0]+' '+t[1]));}); }
function popularHTML(){ return '<div class="pchips"><span class="lbl">Popular Searches</span>'+POPULAR.map(function(p){return '<button data-pop="'+esc(p)+'">'+esc(p)+'</button>';}).join('')+'</div>'; }
function plural(n){return n+' '+(n===1?'listing':'listings');}
function count(c){return plural(c.items.length);}
function item(x){
  var i=x.i;
  return '<div class="item'+(i[0]==='Move to Malaysia'?' star':'')+'"><div class="t"><b>'+esc(i[0])+'</b><div class="d">'+esc(i[1])+'</div><span class="a">'+esc(i[2])+'</span></div><div class="acts">'
   +(i[3]?'<a class="w" href="'+esc(i[3])+'" target="_blank" rel="noopener">Website</a>':'')
   +(i[2]!=='Online'?'<a class="m" href="#map/'+encodeURIComponent(lq(i))+'">Map</a>':'')
   +'<button class="s" data-save="'+esc(i[0])+'" aria-label="Save">'+(isSaved(i[0])?'❤️':'🤍')+'</button></div></div>';
}
function bar(title){
  if(!title){ $('#bar').innerHTML='<a class="logo" href="#home" aria-label="MYSG home">MY<b>SG</b></a><div class="seg">'+[['all','All'],['family','Family'],['retire','Retire'],['business','Business']].map(function(a){return '<button data-aud="'+a[0]+'" class="'+(aud===a[0]?'on':'')+'">'+a[1]+'</button>';}).join('')+'</div>'; return; }
  $('#bar').innerHTML='<button class="back" id="back" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="ttl">'+esc(title)+'</div>'+ptsChip()+'<a class="logo" href="#home" style="font-size:1.2rem">MY<b>SG</b></a>';
  $('#back').onclick=function(){ if(history.length>1) history.back(); else location.hash='home'; };
}
/* Map query for a listing, and for each category chip */
function lq(i){ var a=i[2]; if(a==='Nationwide'||a==='Online') return i[0]+', Johor Bahru'; if(a==='Singapore'||a==='Kuala Lumpur') return i[0]+', '+a; return i[0]+', '+a+', Johor'; }
var CATQ={relocation:'Move to Malaysia, Johor Bahru',gov:'Immigration office Johor Bahru',property:'Real estate agency Johor Bahru',schools:'International schools Johor Bahru',health:'Hospitals Johor Bahru',money:'Banks Johor Bahru',telco:'Mobile phone shops Johor Bahru',utilities:'TNB office Johor Bahru',transport:'RTS Link Bukit Chagar Johor Bahru',shopping:'Shopping malls Johor Bahru',movers:'Movers Johor Bahru',insurance:'Insurance companies Johor Bahru'};
var MAPQ='Johor Bahru, Johor';
function embUrl(q){return 'https://maps.google.com/maps?q='+encodeURIComponent(q)+'&z=13&output=embed';}
function gmUrl(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);}
/* ---------- Points & Rewards (saved on this device only, localStorage 'mysg-points') ---------- */
var LEVELS=[[0,'Newcomer'],[50,'Settler'],[150,'Local'],[400,'JB Pro']];
var PTS={total:0,log:[],once:{},day:{}};
try{ var _p=JSON.parse(localStorage.getItem('mysg-points')||'null'); if(_p&&typeof _p.total==='number') PTS=_p; }catch(e){}
PTS.once=PTS.once||{}; PTS.day=PTS.day||{}; PTS.log=PTS.log||[];
function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function savePts(){ try{ localStorage.setItem('mysg-points',JSON.stringify(PTS)); }catch(e){} }
function level(t){ var cur=LEVELS[0], nxt=null; LEVELS.forEach(function(l,k){ if(t>=l[0]){cur=l; nxt=LEVELS[k+1]||null;} }); return {name:cur[1], from:cur[0], next:nxt}; }
function toast(m){ var t=$('#toast'); if(!t) return; t.textContent=m; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove('show');},1600); }
function award(pts,label,onceKey,capKey,cap){
  if(onceKey){ if(PTS.once[onceKey]) return; PTS.once[onceKey]=1; }
  if(capKey){ if(PTS.day.date!==today()) PTS.day={date:today()}; PTS.day[capKey]=(PTS.day[capKey]||0); if(PTS.day[capKey]>=cap) return; PTS.day[capKey]++; }
  PTS.total+=pts; PTS.log.unshift({d:today(),l:label,p:pts}); PTS.log=PTS.log.slice(0,20); savePts();
  var c=document.querySelectorAll('.pts b'); c.forEach(function(x){x.textContent=PTS.total;});
  toast('+'+pts+' '+(pts===1?'point':'points')+' · '+label);
}
function ptsChip(){ return '<a class="pts" href="#rewards" aria-label="Points & Rewards"><i>★</i><b>'+PTS.total+'</b></a>'; }
/* daily visit */
(function(){ if(PTS.day.date!==today()){ PTS.day={date:today()}; savePts(); setTimeout(function(){ award(5,'Daily Visit','visit-'+today()); },800); } })();
var P={};
P.home=function(){
  var big=AUD[aud].map(function(id){return C[id];});
  var rest=D.filter(function(c){return AUD[aud].indexOf(c.id)<0;}).slice(0,7);

  +'<label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search '+ALL.length+' companies or services…" autocomplete="off"><div class="sres" id="sres" hidden></div></label>'
  +'<div class="shd"><h2>Popular</h2><div><a href="#areas-list">By Area</a><a href="#all">All Services</a></div></div>'
  +'<div class="big">'+big.map(function(c,k){return '<a class="bigt" href="#c-'+c.id+'"><span class="ic" style="background:'+BG[k]+'">'+c.icon+'</span><span><b>'+esc(c.name)+'</b><small>'+count(c)+'</small></span></a>';}).join('')+'</div>'
  +'<div class="icons">'+rest.map(function(c){return '<a href="#c-'+c.id+'"><span>'+c.icon+'</span>'+esc(c.short||c.name)+'</a>';}).join('')+'<a href="#all"><span>▦</span>More</a></div>'
  +'<div class="promos" id="promos">'
  +'<a class="promo" href="'+MTM+'" target="_blank" rel="noopener"><span class="tag">↗</span><div class="k">Need help with your move?</div><span class="logopill"><img src="icons/mtm-logo.png" alt="Move to Malaysia"></span><span class="chip">movetomalaysia.com</span></a>'
  /* Advertise slide opens the Advertise & Get Featured plans (prices and payment links live in pay.js) */
  +'<a class="promo" href="#advertise"><span class="tag">Ad Space</span><div class="k">Advertise on MYSG</div><h3>Put your business in front of people moving to JB</h3><span class="chip">Featured Listing</span></a>'
  +'</div><div class="pdots" id="pdots"><i class="on"></i><i></i></div>';
};
P.all=function(){ return '<div class="list">'+D.map(function(c){return '<a class="row" href="#c-'+c.id+'"><span>'+c.icon+'</span>'+esc(c.name)+'<small>'+count(c)+'</small></a>';}).join('')+'</div>'; };
P['areas-list']=function(){
  var m={}; ALL.forEach(function(x){m[x.i[2]]=(m[x.i[2]]||0)+1;});
  return '<div class="list">'+Object.keys(m).sort(function(a,b){return m[b]-m[a];}).map(function(a){return '<a class="row" href="#a-'+encodeURIComponent(a)+'"><span>📍</span>'+esc(a)+'<small>'+plural(m[a])+'</small></a>';}).join('')+'</div><p class="note">Every listing also has a Map button that shows it on the map.</p>';
};
P.map=function(){ return '<label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="mq" type="search" placeholder="Search places or MYSG listings…" autocomplete="off"><div class="sres" id="msres" hidden></div></label>'
  +'<div class="mchips" id="mchips">'+D.map(function(c){return '<button data-mc="'+c.id+'">'+esc(c.short||c.name)+'</button>';}).join('')+'</div>'
  +'<div class="mapbox"><iframe id="mframe" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe><a class="gmo" id="gmo" target="_blank" rel="noopener">Open in Google Maps ↗</a></div>'; };
P.community=function(sub,term){
  var top='<div class="ctop"><div class="cseg"><a href="#community" class="'+(sub!=='threads'?'on':'')+'">Common Terms</a><a href="#community/threads" class="'+(sub==='threads'?'on':'')+'">Threads</a></div>';
  if(sub==='threads'){
    return top+'</div>'+THREADS.map(function(t){ var ok=/^https:\/\/chat\.whatsapp\.com\//.test(t.link||'');
      return '<div class="thr"><div class="t"><b>'+esc(t.name)+'</b><div class="d">'+esc(t.desc)+'</div></div>'+(ok?'<a class="wa" href="'+esc(t.link)+'" target="_blank" rel="noopener">Join on WhatsApp</a>':'<span class="soon">Coming Soon</span>')+'</div>'; }).join('')
      +'<p class="note">Discussion groups on WhatsApp are coming soon.</p>';
  }
  return top+'<label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="tq" type="search" placeholder="Search '+TERMS.length+' common terms…" autocomplete="off" value="'+esc(term||'')+'"></label></div><div id="tlist"></div>';
};
function termsHTML(v){ var list=v?findTerms(v):TERMS; return list.length?list.map(function(t){return '<div class="term" data-term="'+esc(t[0])+'"><div class="h"><b>'+esc(t[0])+(PTS.once['term-'+t[0]]?'<span class="rd">✓</span>':'')+'</b><span class="tag">'+esc(t[2])+'</span></div><div class="d">'+esc(t[1])+'</div></div>';}).join(''):'<p class="empty">No terms match. Try another word.</p>'; }
var PAYOK=/^https:\/\/([a-z0-9-]+\.)*(hit-pay\.com|hitpay\.com|hitpayapp\.com|hitpay\.app)\//i;
P.advertise=function(){ var plans=window.MYSG_PLANS||[];
  return '<p class="note" style="margin-top:4px">Reach families, retirees and businesses moving to JB. Pick a plan below.</p>'
   +plans.map(function(pl){ var ok=PAYOK.test(pl.link||'');
     return '<div class="card plan"><h3>'+esc(pl.name)+'</h3><div class="d" style="color:var(--muted);font-size:.88rem">'+esc(pl.desc)+'</div><div class="pr">'+(pl.price?esc(pl.price):'Price Coming Soon')+'</div><div class="row2">'
      +(ok?'<a class="paybtn" href="'+esc(pl.link)+'" target="_blank" rel="noopener">Pay Now</a>':'<span class="paybtn" aria-disabled="true">Pay Now</span><span class="soon">Coming Soon</span>')+'</div></div>'; }).join('')
   +'<p class="note">Secure payment by HitPay · PayNow, cards, GrabPay. Payments open on HitPay’s secure page; MYSG never sees your card details.</p>'; };
P.rewards=function(){ var L=level(PTS.total), pct=L.next?Math.min(100,Math.round((PTS.total-L.from)/(L.next[0]-L.from)*100)):100;
  var earn=[['Daily Visit','+5'],['Save a Listing','+2'],['Open a Website or Map','+1'],['Read a Common Term','+1'],['Join a WhatsApp Group','+10']];
  var perks=['Partner Discounts','Free Moving Checklist','Priority Relocation Call','Member Badge'];
  return '<div class="card"><div class="ptotal"><b>'+PTS.total+'</b><span>points</span></div><div class="lvl"><span>'+esc(L.name)+'</span><span class="nx">'+(L.next?(L.next[0]-PTS.total)+' to '+esc(L.next[1]):'Top Level')+'</span></div><div class="bar2"><i style="width:'+pct+'%"></i></div></div>'
   +'<div class="card"><h3>How to Earn</h3>'+earn.map(function(e){return '<div class="rrow"><span>'+e[0]+'</span><b>'+e[1]+'</b></div>';}).join('')+'</div>'
   +'<div class="card"><h3>Recent Activity</h3>'+(PTS.log.length?PTS.log.slice(0,10).map(function(e){return '<div class="rrow"><span>'+esc(e.l)+'</span><b>+'+e.p+'</b></div>';}).join(''):'<div class="rrow"><span style="color:var(--muted)">No points yet.</span></div>')+'</div>'
   +'<div class="card"><h3>Rewards</h3>'+perks.map(function(r){return '<div class="rrow"><span>'+r+'</span><span class="soon">Coming Soon</span></div>';}).join('')+'</div>'
   +'<p class="note">Points are saved on this device only. Clearing your browser data resets them.</p>'; };
P.saved=function(){ var s=ALL.filter(function(x){return isSaved(x.i[0]);}); return s.length?s.map(item).join(''):'<p class="empty">Nothing saved yet. Tap 🤍 on any listing to keep it here.</p>'; };
P.more=function(){ return '<a class="promo" style="margin:4px 0 14px" href="'+MTM+'" target="_blank" rel="noopener"><span class="tag">↗</span><div class="k">Need help with your move?</div><span class="logopill"><img src="icons/mtm-logo.png" alt="Move to Malaysia"></span><span class="chip">movetomalaysia.com</span></a><div class="list"><a class="row" href="#all"><span>▦</span>All Services<small>'+plural(ALL.length)+'</small></a><a class="row" href="#areas-list"><span>📍</span>Browse by Area</a><a class="row" href="#saved"><span>❤️</span>Saved</a><a class="row" href="#rewards"><span>⭐</span>Points & Rewards<small>'+PTS.total+' points</small></a><a class="row" href="#advertise"><span>📣</span>Advertise & Get Featured</a></div><p class="note">MYSG lists real companies and services to help you move to and settle in Johor. Listings are for information only and are not endorsements. Details change, so check with each company directly.</p>'; };
var TITLES={all:'All Services','areas-list':'Browse by Area',map:'Map',community:'Community',saved:'Saved',more:'More',advertise:'Advertise & Get Featured',rewards:'Points & Rewards'};
function render(){
  var r=(location.hash||'#home').slice(1)||'home', html, title=null, s=$('#screen');
  if(r.indexOf('c-')===0&&C[r.slice(2)]){ var c=C[r.slice(2)]; title=c.icon+' '+c.name; html=c.items.map(function(i){return item({c:c,i:i});}).join(''); }
  else if(r.indexOf('a-')===0){ var a=decodeURIComponent(r.slice(2)); title='📍 '+a; html=ALL.filter(function(x){return x.i[2]===a;}).map(item).join('')||'<p class="empty">No listings here.</p>'; }
  else if(r==='map'||r==='areas'||r.indexOf('map/')===0){ if(r.indexOf('map/')===0) MAPQ=decodeURIComponent(r.slice(4)); r='map'; title=TITLES.map; html=P.map(); }
  else if(r==='community'||r.indexOf('community/')===0){ var cs=r.split('/'); var csub=cs[1]==='threads'?'threads':'terms', cterm=cs[1]==='t'?decodeURIComponent(cs.slice(2).join('/')):''; r='community'; title=TITLES.community; html=P.community(csub,cterm); }
  else if(P[r]&&r!=='home'){ title=TITLES[r]; html=P[r](); }
  else { r='home'; html=P.home(); }
  bar(title); s.innerHTML=html; s.classList.toggle('fit',r==='home'); s.classList.toggle('mapv',r==='map'); s.scrollTop=0;
  var tk=r==='home'?'home':r==='map'?'map':r==='community'?'community':r==='saved'?'saved':r==='more'?'more':'';
  document.querySelectorAll('#tabbar a').forEach(function(x){x.classList.toggle('on',x.dataset.t===tk);});
  if(r==='home') bindHome();
  if(r==='map') bindMap();
  if(r==='community'&&$('#tq')){ var tq=$('#tq'); $('#tlist').innerHTML=termsHTML(tq.value.trim()); tq.oninput=function(){ $('#tlist').innerHTML=termsHTML(tq.value.trim()); }; }
}
function bindHome(){
  document.querySelectorAll('[data-aud]').forEach(function(b){b.onclick=function(){aud=b.dataset.aud; render();};});
  var q=$('#q'), box=$('#sres');
  q.oninput=function(){ var v=q.value.trim(); if(!v){ box.hidden=false; box.innerHTML=popularHTML(); return; }
    var cats=findCats(v).slice(0,2), terms=findTerms(v).slice(0,2), hits=findListings(v).slice(0,8);
    var h=cats.map(function(c){return '<a href="#c-'+c.id+'"><span>'+c.icon+'</span><span><b>'+esc(c.name)+'</b><small>'+count(c)+'</small></span></a>';}).join('')
      +terms.map(function(t){return '<a href="#community/t/'+encodeURIComponent(t[0])+'"><span>📖</span><span>'+esc(t[0])+'<small>'+esc(t[1])+'</small></span></a>';}).join('')
      +hits.map(function(x){return '<a href="#c-'+x.c.id+'"><span>'+x.c.icon+'</span><span>'+esc(x.i[0])+'<small>'+esc(x.c.name)+' · '+esc(x.i[2])+'</small></span></a>';}).join('');
    box.hidden=false; box.innerHTML=h||'<a href="'+MTM+'" target="_blank" rel="noopener"><span>🌏</span><span>No match. Ask Move to Malaysia<small>movetomalaysia.com</small></span></a>'; };
  q.onfocus=function(){ if(!q.value.trim()){ box.hidden=false; box.innerHTML=popularHTML(); } };
  q.onblur=function(){ setTimeout(function(){ if(document.activeElement!==q && !q.value.trim()) box.hidden=true; },200); };
  box.onmousedown=function(e){ var b=e.target.closest('[data-pop]'); if(!b) return; e.preventDefault(); q.value=b.dataset.pop; q.oninput(); };
}
function setMap(q,keepUrl){ MAPQ=q; $('#mframe').src=embUrl(q); $('#gmo').href=gmUrl(q); if(!keepUrl) history.replaceState(null,'','#map/'+encodeURIComponent(q)); }
function bindMap(){
  var q=$('#mq'), box=$('#msres');
  setMap(MAPQ,true);
  function clearChips(){ document.querySelectorAll('#mchips button').forEach(function(b){b.classList.remove('on');}); }
  function go(v){ box.hidden=true; q.blur(); clearChips(); setMap(v); }
  q.onfocus=function(){ if(!q.value.trim()){ box.hidden=false; box.innerHTML=popularHTML(); } };
  q.onblur=function(){ setTimeout(function(){ if(document.activeElement!==q && !q.value.trim()) box.hidden=true; },200); };
  box.onmousedown=function(e){ var b=e.target.closest('[data-pop]'); if(!b) return; e.preventDefault(); q.value=b.dataset.pop; q.oninput(); };
  q.oninput=function(){ var v=q.value.trim(); if(!v){ box.hidden=false; box.innerHTML=popularHTML(); return; }
    var cats=findCats(v).slice(0,2), hits=findListings(v).filter(function(x){return x.i[2]!=='Online';}).slice(0,6);
    box.hidden=false; box.innerHTML=cats.map(function(c){return '<a href="#" data-mq="'+esc(CATQ[c.id]||c.name+' Johor Bahru')+'"><span>'+c.icon+'</span><span><b>'+esc(c.name)+'</b><small>Show on map</small></span></a>';}).join('')+hits.map(function(x){return '<a href="#" data-mq="'+esc(lq(x.i))+'"><span>'+x.c.icon+'</span><span>'+esc(x.i[0])+'<small>'+esc(x.c.short||x.c.name)+' · '+esc(x.i[2])+'</small></span></a>';}).join('')
      +'<a href="#" data-mq="'+esc(v)+'"><span>🔎</span><span>Search the map for “'+esc(v)+'”</span></a>'; };
  q.onkeydown=function(e){ if(e.key==='Enter'&&q.value.trim()){ e.preventDefault(); go(q.value.trim()); } };
  box.onclick=function(e){ var a=e.target.closest('[data-mq]'); if(!a) return; e.preventDefault(); go(a.dataset.mq); };
  $('#mchips').onclick=function(e){ var b=e.target.closest('[data-mc]'); if(!b) return; document.querySelectorAll('#mchips button').forEach(function(x){x.classList.toggle('on',x===b);}); q.value=''; box.hidden=true; setMap(CATQ[b.dataset.mc]||(C[b.dataset.mc].name+' Johor Bahru')); };
}
document.addEventListener('click',function(e){
  var a=e.target.closest('.acts a.w, .acts a.m'); if(a){ award(1,a.classList.contains('w')?'Opened a Website':'Opened a Map',null,'open',10); return; }
  var w=e.target.closest('.thr a.wa'); if(w){ award(10,'Joined a WhatsApp Group','wa-'+w.getAttribute('href')); return; }
  var t=e.target.closest('[data-term]'); if(t){ var k='term-'+t.dataset.term; if(!PTS.once[k]){ award(1,'Read a Common Term',k); var b0=t.querySelector('b'); if(b0&&!b0.querySelector('.rd')) b0.insertAdjacentHTML('beforeend','<span class="rd">✓</span>'); } return; }
});
document.addEventListener('click',function(e){ var b=e.target.closest('[data-save]'); if(!b) return; if(!isSaved(b.dataset.save)) award(2,'Saved a Listing','save-'+b.dataset.save); toggleSave(b.dataset.save); b.textContent=isSaved(b.dataset.save)?'❤️':'🤍'; if(location.hash==='#saved') render(); });
addEventListener('hashchange',render); render();
})();
document.addEventListener('scroll',function(e){ var p=e.target; if(!p||p.id!=='promos') return; var k=Math.round(p.scrollLeft/p.clientWidth); document.querySelectorAll('#pdots i').forEach(function(d,j){d.classList.toggle('on',j===k);}); },true);
</script>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
(function(){
  var box=document.getElementById('install'), standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone, seen=false;
  try{ seen=localStorage.getItem('mysg-install-x')==='1'; }catch(e){}
  if(standalone||seen) return;
  var deferred=null;
  addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred=e; box.classList.add('show'); });
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){ document.getElementById('installtxt').innerHTML='<strong>Install MYSG</strong><br>Tap Share, then <b>Add to Home Screen</b>.'; document.getElementById('installbtn').style.display='none'; setTimeout(function(){ box.classList.add('show'); },1500); }
  document.getElementById('installbtn').onclick=function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.then(function(){ deferred=null; box.classList.remove('show'); }); };
  document.getElementById('installx').onclick=function(){ box.classList.remove('show'); try{ localStorage.setItem('mysg-install-x','1'); }catch(e){} };
  addEventListener('appinstalled', function(){ box.classList.remove('show'); });
})();
</script>
